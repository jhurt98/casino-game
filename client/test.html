<!DOCTYPE html>
<html>
<head>
    <title>Room Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .container { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; }
        button { margin: 5px; padding: 5px 10px; }
        input { margin: 5px; padding: 5px; }
        #log { background: #f0f0f0; padding: 10px; height: 300px; overflow-y: scroll; }
        .log-entry { margin: 2px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h3>Room Testing</h3>
        <input id="roomId" placeholder="Room ID" value="test123">
        <button onclick="createRoom()">Create Room</button>
        <button onclick="joinRoom()">Join Room</button>
        <button onclick="connectWS()">Connect WebSocket</button>
        <button onclick="startGame()">Start Game</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div class="container">
        <strong>Player ID:</strong> <span id="playerIdDisplay">Not joined</span><br>
        <strong>WebSocket:</strong> <span id="wsStatus">Disconnected</span>
    </div>

    <div id="log"></div>

    <script>
        let ws;
        let playerId;

        async function createRoom() {
            try {
                const response = await fetch('http://localhost:8080/createRoom');
                const text = await response.text();
                log('✅ Create room response: ' + text);
            } catch (e) {
                log('❌ Create room failed: ' + e.message);
            }
        }

        async function joinRoom() {
            try {
                const roomId = document.getElementById('roomId').value;
                const response = await fetch(`http://localhost:8080/join/${roomId}`, {method: 'POST'});
                playerId = await response.text();
                document.getElementById('playerIdDisplay').textContent = playerId;
                log('✅ Joined room, playerId: ' + playerId);
            } catch (e) {
                log('❌ Join room failed: ' + e.message);
            }
        }

        function connectWS() {
            if (!playerId) {
                log('❌ Must join room first');
                return;
            }
            
            const roomId = document.getElementById('roomId').value;
            ws = new WebSocket(`ws://localhost:8080/game/${roomId}/${playerId}`);
            
            ws.onopen = () => {
                log('🔌 WebSocket connected');
                document.getElementById('wsStatus').textContent = 'Connected';
            };
            
            ws.onmessage = (e) => {
                log('📨 WS message: ' + e.data);
            };
            
            ws.onclose = () => {
                log('🔌 WebSocket disconnected');
                document.getElementById('wsStatus').textContent = 'Disconnected';
            };
            
            ws.onerror = (e) => {
                log('❌ WebSocket error: ' + e);
            };
        }

        function startGame() {
            if (!ws) {
                log('❌ Must connect WebSocket first');
                return;
            }
            
            const msg = JSON.stringify({type: 'start', data: {}});
            ws.send(msg);
            log('🎮 Sent start game message');
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
    </script>
</body>
</html>
